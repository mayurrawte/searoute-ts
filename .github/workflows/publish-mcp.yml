name: Publish @searoute-ts/mcp to npm

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

defaults:
  run:
    working-directory: examples/mcp-server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # NOTE: no registry-url — it writes an _authToken placeholder into
          # .npmrc which overrides OIDC trusted publishing with a dummy token.
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # prepublishOnly runs the build before this publishes.
      # Auth via OIDC trusted publisher (configured on npmjs.com) — no token.
      # --access public: the package is scoped and would default to restricted.
      - run: npm publish --provenance --access public
